name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/check-rust-boundaries.py
      - run: python3 scripts/test-vault-validation.py
      - run: python3 scripts/test-vault-adversarial-runner.py
      - run: python3 scripts/test-vault-snapshot.py
      - run: python3 scripts/test-semantic-rubric.py
      - run: python3 scripts/test-qualification-metrics.py
      - run: cargo build --locked --release
      - run: python3 scripts/test-rust-terminal.py target/release/synapse
      - run: python3 scripts/test-rust-review.py target/release/synapse
      - name: Install and run outside checkout
        shell: bash
        run: |
          install_root=$(mktemp -d)
          run_root=$(mktemp -d)
          cargo install --locked --path crates/synapse-terminal --root "$install_root"
          cd "$run_root"
          "$install_root/bin/synapse" --help
          "$install_root/bin/synapse" --version
          "$install_root/bin/synapse" doctor --workspace "$run_root" --offline
