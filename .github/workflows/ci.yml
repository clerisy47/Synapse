name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned development toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 scripts/check-rust-boundaries.py
      - run: cargo build --locked --release
      - run: cargo build --locked --release --example terminal-driver
      - run: python3 scripts/test-native-pty.py
      - run: python3 scripts/smoke-native.py
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --locked --workspace --all-targets
      - run: cargo +1.85.0 test --locked --workspace
