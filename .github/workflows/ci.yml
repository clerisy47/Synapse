name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run boundaries
      - run: npm test
      - run: npm run check:network
      - run: npm run check:writes
      - run: npm run check:schema
      - run: npm run build

      - name: Assert build artifacts
        run: test -f main.js
