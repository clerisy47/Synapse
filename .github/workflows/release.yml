name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run boundaries
      - run: npm run check:network
      - run: npm run check:writes
      - run: npm run check:schema
      - run: npm test
      - run: npm run test:release
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-cli-development
          path: |
            synapse-cli-*.tgz
          if-no-files-found: error
