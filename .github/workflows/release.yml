name: Native development candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/check-rust-boundaries.py
      - run: cargo build --locked --release
      - run: python3 scripts/test-rust-terminal.py target/release/synapse
      - run: python3 scripts/package-rust.py
      - run: python3 scripts/test-rust-package.py target/packages/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-development-${{ runner.os }}-${{ runner.arch }}
          path: target/packages/*
          if-no-files-found: error
