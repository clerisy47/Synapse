name: Native development candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 scripts/check-rust-boundaries.py
      - run: cargo build --locked --release
      - run: cargo build --locked --release --example terminal-driver
      - run: python3 scripts/test-native-pty.py
      - run: python3 scripts/smoke-native.py
      - name: Stage native-only development artifact
        run: |
          mkdir candidate
          cp target/release/synapse LICENSE candidate/
          tar -czf synapse-${{ matrix.target }}.tar.gz -C candidate synapse LICENSE
          tar -tzf synapse-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-${{ matrix.target }}-development
          path: synapse-${{ matrix.target }}.tar.gz
          if-no-files-found: error
