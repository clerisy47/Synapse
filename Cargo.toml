[workspace]
members = ["rust/core", "rust/application", "rust/adapters", "rust/terminal"]
default-members = [".", "rust/core", "rust/application", "rust/adapters", "rust/terminal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "synapse-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
include = ["rust/main.rs", "tests/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[[bin]]
name = "synapse"
path = "rust/main.rs"

[dependencies]
synapse-adapters = { path = "rust/adapters" }
synapse-terminal = { path = "rust/terminal" }

[lints]
workspace = true
