[package]
name = "synapse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml_ng = "=0.10.0"

sha2 = { version = "=0.10.9", default-features = false, features = ["std", "force-soft"] }
chrono = { version = "=0.4.42", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std", "serde"] }

unicode-normalization = "=0.1.25"
unicode-casefold = "=0.2.0"

[lints]
workspace = true

[dev-dependencies]
serde_json = "=1.0.145"
