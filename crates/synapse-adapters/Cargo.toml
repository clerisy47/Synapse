[package]
name = "synapse-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
synapse-core = { path = "../synapse-core" }

rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "use-libc", "process", "termios", "event"] }

serde_json = "=1.0.145"
ureq = { version = "=3.1.2", default-features = false, features = ["rustls", "json"] }

ctrlc = "=3.4.7"

getrandom = "=0.2.17"

# Fixed protocol SDK; only stateless Streamable HTTP server transport.
rmcp = { version = "=0.8.5", default-features = false, features = ["base64", "macros", "server", "transport-streamable-http-server"] }
tokio = { version = "=1.47.1", features = ["rt", "sync", "time"] }
http = "=1.3.1"
http-body-util = "=0.1.3"
bytes = "=1.10.1"
# Upstream SDK traces include messages; compile all tracing out.
tracing = { version = "=0.1.44", default-features = false, features = ["max_level_off", "release_max_level_off"] }

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "=0.8.5", default-features = false, features = ["base64", "macros", "client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "stream"] }
